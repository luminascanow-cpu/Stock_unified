services:
  - type: web
    name: stock-monitor-pro
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0 # Specify a compatible Python version
      - key: NEWS_API_KEY
        sync: false
