app:
  name: "GeoPolitical Stock Monitor - India"
  version: "2.0.0"
  refresh_interval: 60  # seconds
  news_refresh_interval: 60  # independent verified-news refresh
  tech_refresh_interval: 60  # seconds (technical data refreshes faster)
  debug: false

news_sources:
  rss_feeds:
    - name: "Economic Times"
      url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
    - name: "Business Standard"
      url: "https://www.business-standard.com/rss/markets-106.rss"
    - name: "Moneycontrol Markets"
      url: "https://www.moneycontrol.com/rss/marketreports.xml"
    - name: "Moneycontrol Buzzing Stocks"
      url: "https://www.moneycontrol.com/rss/buzstock.xml"
    - name: "LiveMint"
      url: "https://www.livemint.com/rss/markets"
    - name: "Reuters India"
      url: "https://feeds.reuters.com/reuters/INbusinessNews"
    - name: "NDTV Profit"
      url: "https://feeds.feedburner.com/ndtvprofit-latest"

sentiment:
  model: "finbert"  # options: vader, textblob, finbert
  context_aware: true
  thresholds:
    strong_bullish: 0.5
    weak_bullish: 0.15
    strong_bearish: -0.5
    weak_bearish: -0.15
  india_context:
    oil_price_impact: true
    currency_impact: true
  weights:
    title: 0.6
    description: 0.4

sectors:
  - name: "Banking & Finance"
    keywords:
      - "RBI"
      - "bank"
      - "NBFC"
      - "interest rate"
      - "repo rate"
      - "credit"
      - "loan"
      - "NPA"
      - "Basel"
      - "liquidity"
    stocks:
      - "HDFCBANK"
      - "ICICIBANK"
      - "SBIN"
      - "KOTAKBANK"
      - "AXISBANK"
      - "BANDHANBNK"
      - "FEDERALBNK"

