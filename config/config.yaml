prediction:
  min_confidence: 0.3
  backtest_enabled: true
  time_horizons:
    intraday:
      days: 1
      label: "Intraday"
    one_week:
      days: 5
      label: "1 Week"
    one_month:
      days: 20
      label: "1 Month"

alerts:
  enabled: true
  severity_thresholds:
    high: 0.7
    medium: 0.5
    low: 0.3
  max_alerts: 20
  keywords:
    - "breaking"
    - "war"
    - "sanctions"
    - "RBI cut"
    - "rate hike"
    - "emergency"
    - "crash"
    - "surge"
    - "ban"
    - "attack"
    - "collapse"
    - "record high"
    - "record low"
    - "US visa"
    - "OPEC"
    - "Modi"
    - "budget"
    - "GST"
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

scheduler:
  market_hours:
    enabled: true
    refresh_job_enabled: false  # API periodic_refresh is the single refresh owner
    interval_minutes: 5
